plugins { id 'com.android.application' }

def appHost = System.getenv('SCHAT_HOST') ?: 'chat.satingraphic.ca'
def verCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'ca.satingraphic.schat'
    compileSdk 34
    defaultConfig {
        applicationId 'ca.satingraphic.schat'
        minSdk 28
        // 33: full-screen call notifications are allowed without extra user steps
        targetSdk 33
        versionCode verCode + 100
        versionName "2.0.${verCode}"
        buildConfigField 'String', 'HOST', "\"${appHost}\""
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            storeFile file(System.getenv('SCHAT_KEYSTORE') ?: 'release.keystore')
            storePassword System.getenv('SCHAT_KEYSTORE_PASS') ?: 'schat-temp'
            keyAlias System.getenv('SCHAT_KEY_ALIAS') ?: 'schat'
            keyPassword System.getenv('SCHAT_KEY_PASS') ?: (System.getenv('SCHAT_KEYSTORE_PASS') ?: 'schat-temp')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
