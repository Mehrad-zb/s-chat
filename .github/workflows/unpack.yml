name: Unpack upload
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract bootstrap.zip into the repo
        id: x
        run: |
          [ -f bootstrap.zip ] || { echo "nothing to unpack"; exit 0; }
          unzip -q -o bootstrap.zip -d /tmp/src
          rsync -a /tmp/src/s-chat/ ./ --exclude .github
          chmod +x deploy/*.sh
          git rm -q bootstrap.zip
          git rm -q --ignore-unmatch android.yml unpack.yml
          git config user.name "Mehrad"
          git config user.email "mehrad.tr@gmail.com"
          git add -A
          git commit -m "Add S-Chat source"
          git push
          echo "done=1" >> "$GITHUB_OUTPUT"
      - name: Build the Android app
        if: steps.x.outputs.done == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml --ref main
