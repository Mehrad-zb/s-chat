name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', 'public/manifest.webmanifest']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SCHAT_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.SCHAT_KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            echo "SCHAT_KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "Using the saved signing key."
          else
            echo "::warning::No SCHAT_KEYSTORE_B64 secret — signing with a temporary key. Add the secrets so updates install over the old app."
            keytool -genkeypair -v -keystore android/app/release.keystore -alias schat -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass schat-temp -keypass schat-temp -dname "CN=S-Chat, O=Satin Graphic, C=CA"
            echo "SCHAT_KEYSTORE_PASS=schat-temp" >> "$GITHUB_ENV"
          fi
          echo "SCHAT_KEYSTORE=release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Fingerprint for assetlinks
        run: |
          FP=$(keytool -list -v -keystore android/app/release.keystore -alias schat -storepass "$SCHAT_KEYSTORE_PASS" | grep 'SHA256:' | head -1 | awk '{print $2}')
          echo "### ANDROID_CERT_SHA256=$FP" >> "$GITHUB_STEP_SUMMARY"
          echo "ANDROID_CERT_SHA256=$FP"
          cp android/app/build/outputs/apk/release/app-release.apk S-Chat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: S-Chat-apk
          path: S-Chat.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest S-Chat.apk --title "S-Chat Android (build ${{ github.run_number }})" \
            --notes "Install S-Chat.apk on Android. Built from ${{ github.sha }}." --latest
